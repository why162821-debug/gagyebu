<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가계부</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #efede6;
  --text: #1d1c19;
  --muted: #6b675e;
  --line: #e3e0d7;
  --income: #0b7a5d;
  --expense: #c23a25;
  --accent: #2f5bd8;
  --accent-ink: #ffffff;
  --shadow: 0 1px 2px rgba(30, 25, 10, .06), 0 4px 16px rgba(30, 25, 10, .05);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131210;
    --surface: #1d1c18;
    --surface-2: #2a2924;
    --text: #efece4;
    --muted: #a5a196;
    --line: #34322b;
    --income: #4fd1a5;
    --expense: #ff8a73;
    --accent: #86a2ff;
    --accent-ink: #10131f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 1000px; margin: 0 auto; padding: 20px 16px 64px; }
button { font: inherit; cursor: pointer; color: inherit; }
h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1rem; margin: 0 0 12px; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 상단 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.month { display: flex; align-items: center; gap: 6px; }
.month .label { min-width: 7.5em; text-align: center; font-weight: 700; font-size: 1.05rem; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-size: 1.2rem; line-height: 1;
}
.icon-btn:hover { background: var(--surface-2); }
.ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: .85rem; }
.ghost:hover { background: var(--surface-2); }

.notice { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: .88rem; }
.notice .link-btn { text-decoration: underline; color: var(--accent); }

/* 요약 */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.stat, .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.stat { padding: 14px 16px; min-width: 0; }
.stat .k { font-size: .8rem; color: var(--muted); }
.stat .v { font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 2px; overflow-wrap: anywhere; }
.stat .sub { font-size: .76rem; color: var(--muted); min-height: 1.2em; }
.income { color: var(--income); }
.expense { color: var(--expense); }
.sub.up { color: var(--expense); }
.sub.down { color: var(--income); }

/* 레이아웃 */
.layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  grid-template-rows: auto 1fr;
  grid-template-areas: "form list" "chart list";
  gap: 16px;
  align-items: start;
}
.card { padding: 18px; }
.a-form { grid-area: form; }
.a-chart { grid-area: chart; }
.a-list { grid-area: list; min-width: 0; }

/* 폼 */
.field { margin-top: 12px; }
.field > label, .field > .lbl { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=date], input[type=search] {
  width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--surface); color: var(--text);
}
.money { position: relative; }
.money input { padding-right: 36px; text-align: right; font-variant-numeric: tabular-nums; font-size: 1.1rem; font-weight: 600; }
.money span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg label { position: relative; display: block; }
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.seg span { display: block; text-align: center; padding: 7px 10px; border-radius: 8px; font-weight: 600; font-size: .9rem; color: var(--muted); }
.seg input:checked + span { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.seg input[value=expense]:checked + span { color: var(--expense); }
.seg input[value=income]:checked + span { color: var(--income); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }

.error { color: var(--expense); font-size: .85rem; min-height: 1.3em; margin: 8px 0 0; }
.btns { display: flex; gap: 8px; margin-top: 6px; }
.primary { flex: 1; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 11px 14px; font-weight: 700; }
.primary:hover { filter: brightness(1.06); }
.a-form.editing { border-color: var(--accent); }

/* 카테고리 이미지 */
.ico {
  --sz: 44px;
  flex: none; width: var(--sz); height: var(--sz); border-radius: 50%;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--c, #8a8a8a) 22%, #fffdf8);   /* 다크 모드에서도 밝은 스티커 느낌 유지 */
}
.ico svg { width: 80%; height: 80%; display: block; }
.ico.sm { --sz: 38px; }
.ico.xs { --sz: 28px; }

/* 카테고리 선택 */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 420px; }
.cats.c4 { grid-template-columns: repeat(4, 1fr); }
.cat-opt { position: relative; display: block; }
.cat-opt input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
.cat-opt .box {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 2px 6px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface);
  transition: background .15s, border-color .15s, box-shadow .15s;
}
.cat-opt .nm { font-size: .74rem; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.25; }
.cat-opt:hover .box { background: var(--surface-2); }
.cat-opt input:checked + .box {
  border-color: var(--c); box-shadow: 0 0 0 1px var(--c);
  background: color-mix(in srgb, var(--c) 12%, var(--surface));
}
.cat-opt input:checked + .box .nm { color: var(--text); }
.cat-opt input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .cat-opt .ico { transition: transform .18s cubic-bezier(.3, 1.6, .5, 1); }
  .cat-opt:hover .ico { transform: translateY(-2px) rotate(-4deg); }
  .cat-opt input:checked + .box .ico { transform: scale(1.12); }
}

/* 카테고리 차트 */
.stack { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--surface-2); margin-bottom: 12px; }
.stack i { display: block; height: 100%; }
.cat-row { display: grid; grid-template-columns: 10px 28px 1fr auto 3.2em; gap: 8px; align-items: center; padding: 4px 0; font-size: .88rem; }
.cat-row .amt { font-variant-numeric: tabular-nums; }
.cat-row .pct { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

/* 목록 */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
.toolbar .seg { min-width: 200px; }
.toolbar input[type=search] { flex: 1; min-width: 140px; padding: 8px 12px; }
.count { color: var(--muted); font-size: .8rem; margin-left: auto; }
.day { margin-top: 14px; }
.day-head { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--line); }
.day-sum { display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
.row { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.row.editing { background: var(--surface-2); border-radius: 8px; }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .c { font-size: .78rem; color: var(--muted); }
.side { text-align: right; }
.amt { font-variant-numeric: tabular-nums; font-weight: 700; }
.acts { display: flex; gap: 2px; justify-content: flex-end; margin-top: 2px; }
.link-btn { background: none; border: 0; color: var(--muted); font-size: .78rem; padding: 3px 7px; border-radius: 6px; }
.link-btn:hover { color: var(--text); background: var(--surface-2); }
.empty { text-align: center; color: var(--muted); padding: 32px 8px; font-size: .92rem; }
.empty .link-btn { font-size: .92rem; text-decoration: underline; color: var(--accent); }

/* 데이터 관리 */
.data { margin-top: 24px; font-size: .88rem; color: var(--muted); }
.data summary { cursor: pointer; padding: 6px 0; }
.data-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.data .hint { margin: 4px 0 0; font-size: .8rem; }
.data .danger { color: var(--expense); }

/* 토스트 */
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 12px;
  display: flex; gap: 14px; align-items: center; font-size: .9rem; box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
  max-width: calc(100vw - 32px); z-index: 10;
}
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: auto; grid-template-areas: "form" "list" "chart"; }
}
@media (max-width: 560px) {
  .summary { grid-template-columns: 1fr 1fr; }
  .stat.balance { grid-column: 1 / -1; order: -1; }
  .stat .v { font-size: 1.2rem; }
  .stat.balance .v { font-size: 1.6rem; }
  .card { padding: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <div id="notice" class="notice" role="status" hidden><span id="noticeMsg"></span> <button class="link-btn" id="noticeRetry" type="button">다시 시도</button></div>

  <div id="main">
  <div id="legacy" class="notice" hidden>이 브라우저에 저장돼 있던 예전 기록 <b id="legacyN"></b>건이 있어요. 서버로 옮기면 어느 기기에서든 볼 수 있고, 옮긴 뒤 이 브라우저의 예전 기록은 지워져요.
    <button class="ghost" id="legacyMove" type="button">서버로 옮기기</button>
    <button class="link-btn" id="legacyLater" type="button">나중에</button></div>

  <header class="top">
    <h1>가계부</h1>
    <div class="month">
      <button class="icon-btn" id="prev" type="button" aria-label="이전 달">‹</button>
      <div class="label" id="monthLabel" aria-live="polite"></div>
      <button class="icon-btn" id="next" type="button" aria-label="다음 달">›</button>
      <button class="ghost" id="thisMonth" type="button" hidden>이번 달</button>
    </div>
  </header>

  <section class="summary" aria-label="월간 요약">
    <div class="stat"><div class="k">수입</div><div class="v income" id="sumInc"></div><div class="sub" id="subInc"></div></div>
    <div class="stat"><div class="k">지출</div><div class="v expense" id="sumExp"></div><div class="sub" id="subExp"></div></div>
    <div class="stat balance"><div class="k">잔액</div><div class="v" id="sumBal"></div><div class="sub" id="subBal"></div></div>
  </section>

  <div class="layout">
    <section class="card a-form" id="formCard" aria-labelledby="formTitle">
      <h2 id="formTitle">내역 추가</h2>
      <form id="form" autocomplete="off">
        <div class="seg" role="radiogroup" aria-label="구분">
          <label><input type="radio" name="type" value="expense" checked><span>지출</span></label>
          <label><input type="radio" name="type" value="income"><span>수입</span></label>
        </div>
        <div class="field"><label for="date">날짜</label><input type="date" id="date" required></div>
        <div class="field">
          <span class="lbl" id="catLabel">분류</span>
          <div class="cats" id="cats" role="radiogroup" aria-labelledby="catLabel"></div>
        </div>
        <div class="field">
          <label for="amount">금액</label>
          <div class="money"><input type="text" id="amount" inputmode="numeric" placeholder="0"><span>원</span></div>
        </div>
        <p class="error" id="err" role="alert"></p>
        <div class="btns">
          <button class="primary" id="submitBtn" type="submit">추가</button>
          <button class="ghost" id="cancelEdit" type="button" hidden>취소</button>
        </div>
      </form>
    </section>

    <section class="card a-list" aria-label="내역 목록">
      <div class="toolbar">
        <div class="seg" role="radiogroup" aria-label="목록 필터">
          <label><input type="radio" name="filter" value="all" checked><span>전체</span></label>
          <label><input type="radio" name="filter" value="income"><span>수입</span></label>
          <label><input type="radio" name="filter" value="expense"><span>지출</span></label>
        </div>
        <input type="search" id="search" placeholder="분류 검색" aria-label="분류 검색">
        <span class="count" id="count"></span>
      </div>
      <div id="list"></div>
    </section>

    <section class="card a-chart" aria-labelledby="chartTitle">
      <h2 id="chartTitle">분류별 지출</h2>
      <div id="chart"></div>
    </section>
  </div>

  <details class="data">
    <summary>데이터 관리</summary>
    <div class="data-actions">
      <button class="ghost" id="exportCsv" type="button">엑셀용 CSV 내보내기</button>
      <button class="ghost" id="exportJson" type="button">백업 저장 (JSON)</button>
      <button class="ghost" id="importJson" type="button">백업 불러오기</button>
      <button class="ghost danger" id="wipeSample" type="button" hidden>샘플 데이터 지우기</button>
      <button class="ghost danger" id="wipe" type="button">전체 삭제</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
    <p class="hint">기록은 서버(Supabase)에 저장돼서 어느 기기에서든 같은 내용이 보여요. 로그인이 없어서 이 페이지 주소를 아는 사람은 누구나 기록을 보고 고칠 수 있으니, 주소는 나눠 주지 마세요. 백업 파일은 따로 받아 둘 수도 있어요.</p>
  </details>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>

const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const num = (n) => n.toLocaleString('ko-KR');
const won = (n) => num(n) + '원';
const colorOf = (type, cat) => (CATS[type].find((c) => c[0] === cat) || [0, '#8a8a8a'])[1];

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach((c) => { if (c != null && c !== false) n.append(c); });
  return n;
}

// ICONS는 위에 적은 고정 SVG뿐이라 innerHTML에 넣어도 안전 (사용자 입력은 조회 키로만 쓰임)
function icon(type, cat, size = '') {
  const n = el('span', { class: 'ico' + (size ? ' ' + size : ''), style: `--c:${colorOf(type, cat)}`, 'aria-hidden': 'true' });
  n.innerHTML = ICONS[cat] || ICONS['기타'];
  return n;
}

/* ---------- 서버(Supabase) ---------- */
// 로그인이 없는 앱이라 세션을 저장·갱신할 필요가 없음
const sb = window.supabase && window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});
const db = () => sb.from(TABLE);

// 42501: 서버가 접근을 막음 (테이블 접근 설정이 아직 안 됐을 때)
const DENIED = '서버가 이 앱의 접근을 막고 있어요. Supabase 테이블 접근 설정이 아직 안 된 것 같아요. (README의 “DB 설정” 참고)';
const denied = (err) => !!err && err.code === '42501';

const fromRow = (r) => ({ id: r.id, seq: Number(r.seq), date: r.date, type: r.type, category: r.cat, memo: r.memo, amount: Number(r.amount), sample: r.sample });
const toRow = (t) => ({ date: t.date, type: t.type, cat: t.category, amount: t.amount });

// 서버가 한 번에 주는 행 수에 제한(기본 1000)이 있어서, 끝날 때까지 나눠서 받음. 쿼리는 순서가 고정돼 있어야 함
async function fetchAll(build) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out.map(fromRow);
  }
}
async function count(where) {
  const q = db().select('id', { count: 'exact', head: true });
  const { count: n, error } = await (where ? where(q) : q);
  if (error) throw error;
  return n || 0;
}

/* 가져온 백업·예전 기록을 검사하고 다듬기 */
function validDate(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}
function isValid(t) {
  return t && typeof t === 'object'
    && validDate(t.date)
    && (t.type === 'income' || t.type === 'expense')
    && Number.isSafeInteger(t.amount) && t.amount > 0 && t.amount <= 99999999999
    && typeof t.category === 'string';
}
function clean(t) {
  return {
    ts: Number.isFinite(t.ts) ? t.ts : 0,   // 백업 파일 속 입력 순서(있으면)
    date: t.date, type: t.type, amount: t.amount,
    category: t.category.slice(0, 20) || '기타',
    memo: typeof t.memo === 'string' ? t.memo.slice(0, 80) : '',
  };
}
const byTs = (a, b) => a.ts - b.ts;

/* 이미 있는 내역과 똑같은 것은 건너뜀 → 같은 백업을 여러 번 불러와도 중복되지 않음 */
async function importRows(list) {
  const key = (t) => `${t.date}|${t.type}|${t.category}|${t.amount}|${t.memo}`;
  const seen = new Map();
  for (const t of await fetchAll(() => db().select(COLS).order('date').order('seq'))) seen.set(key(t), (seen.get(key(t)) || 0) + 1);
  const fresh = [];
  for (const t of list) {
    const left = seen.get(key(t)) || 0;
    if (left > 0) seen.set(key(t), left - 1); else fresh.push(t);
  }
  for (let i = 0; i < fresh.length; i += 500) {
    const { error } = await db().insert(fresh.slice(i, i + 500).map((t) => ({ ...toRow(t), memo: t.memo })));
    if (error) throw error;
  }
  return fresh.length;
}

/* 예전 버전이 이 브라우저(localStorage)에 남겨 둔 기록 */
function legacyRows() {
  try {
    const data = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]');
    return Array.isArray(data) ? data.filter(isValid).map(clean).sort(byTs) : [];
  } catch { return []; }
}

/* ---------- 상태 ---------- */
const now = new Date();
let tx = [];                                // 지금 보는 달과 지난달의 내역
let meta = { total: 0, samples: 0 };          // 전체 건수, 샘플 건수
let view = { y: now.getFullYear(), m: now.getMonth() };
let filter = 'all';
let query = '';
let editingId = null;
let loading = false;
let failed = false;                           // 마지막 불러오기가 실패했는지
let reqId = 0;                               // 오래된 응답을 가려내기 위한 번호
let busy = false;
let legacyLater = false;

const monthKey = (y, m) => `${y}-${pad(m + 1)}`;
const monthTx = (y, m) => tx.filter((t) => t.date.startsWith(monthKey(y, m)));
function totals(list) {
  let inc = 0, exp = 0;
  for (const t of list) t.type === 'income' ? (inc += t.amount) : (exp += t.amount);
  return { inc, exp };
}

/* ---------- 렌더링 ---------- */
function render() {
  $('#monthLabel').textContent = `${view.y}년 ${view.m + 1}월`;
  const isCurrent = view.y === now.getFullYear() && view.m === now.getMonth();
  $('#thisMonth').hidden = isCurrent;
  $('#wipeSample').hidden = !meta.samples;
  $('#wipeSample').textContent = `샘플 데이터 지우기 (${meta.samples}건)`;
  if (loading || failed) { renderPlaceholder(loading ? '불러오는 중…' : '내역을 불러오지 못했어요.'); return; }
  renderSummary();
  renderChart();
  renderList();
}

function renderPlaceholder(msg) {   // 불러오는 중이거나 실패했을 때: 옛 값이 남아 보이지 않게 비워 둠
  for (const id of ['#sumInc', '#sumExp', '#sumBal']) { $(id).textContent = '–'; $(id).className = 'v'; }
  for (const id of ['#subInc', '#subExp', '#subBal']) { $(id).textContent = ''; $(id).className = 'sub'; }
  $('#count').textContent = '';
  $('#chart').replaceChildren(el('div', { class: 'empty', text: msg }));
  $('#list').replaceChildren(el('div', { class: 'empty', text: msg }));
}

function renderSummary() {
  const list = monthTx(view.y, view.m);
  const cur = totals(list);
  const pd = new Date(view.y, view.m - 1, 1);
  const prev = totals(monthTx(pd.getFullYear(), pd.getMonth()));

  $('#sumInc').textContent = won(cur.inc);
  $('#sumExp').textContent = won(cur.exp);
  const bal = cur.inc - cur.exp;
  const balEl = $('#sumBal');
  balEl.textContent = won(bal);
  balEl.className = 'v' + (bal < 0 ? ' expense' : '');

  $('#subInc').textContent = `${list.filter((t) => t.type === 'income').length}건`;

  const se = $('#subExp');
  se.className = 'sub';
  se.textContent = '';
  if (prev.exp > 0) {
    const p = Math.round((cur.exp - prev.exp) / prev.exp * 100);
    se.textContent = p === 0 ? '지난달과 같아요' : `지난달보다 ${Math.abs(p)}% ${p > 0 ? '많음' : '적음'}`;
    if (p > 0) se.classList.add('up');
    else if (p < 0) se.classList.add('down');
  }
  $('#subBal').textContent = cur.inc > 0 ? `수입의 ${Math.round(cur.exp / cur.inc * 100)}%를 지출` : '';
}

function renderChart() {
  const box = $('#chart');
  box.replaceChildren();
  const sums = new Map();
  for (const t of monthTx(view.y, view.m)) {
    if (t.type === 'expense') sums.set(t.category, (sums.get(t.category) || 0) + t.amount);
  }
  const rows = [...sums.entries()].sort((a, b) => b[1] - a[1]);
  const total = rows.reduce((s, r) => s + r[1], 0);
  if (!total) { box.append(el('div', { class: 'empty', text: '이 달의 지출 내역이 없어요.' })); return; }

  box.append(el('div', { class: 'stack', role: 'img', 'aria-label': '분류별 지출 비율' },
    rows.map(([cat, v]) => el('i', { style: `width:${v / total * 100}%;background:${colorOf('expense', cat)}`, title: `${cat} ${won(v)}` }))));
  for (const [cat, v] of rows) {
    const pct = v / total * 100;
    box.append(el('div', { class: 'cat-row' },
      el('span', { class: 'dot', style: `background:${colorOf('expense', cat)}` }),
      icon('expense', cat, 'xs'),
      el('span', { text: cat }),
      el('span', { class: 'amt', text: won(v) }),
      el('span', { class: 'pct', text: pct < 1 ? '<1%' : Math.round(pct) + '%' })));
  }
}

function rowEl(t) {
  const label = `${t.category} ${won(t.amount)}`;
  return el('div', { class: 'row' + (t.id === editingId ? ' editing' : '') },
    icon(t.type, t.category, 'sm'),
    el('div', {},
      el('div', { class: 't', text: t.category }),
      t.memo ? el('div', { class: 'c', text: t.memo }) : null),   // 예전에 적어 둔 메모가 있으면 그대로 보여줌
    el('div', { class: 'side' },
      el('div', { class: 'amt ' + t.type, text: (t.type === 'income' ? '+' : '-') + won(t.amount) }),
      el('div', { class: 'acts' },
        el('button', { class: 'link-btn', type: 'button', text: '수정', 'aria-label': `수정: ${label}`, onclick: () => startEdit(t.id) }),
        el('button', { class: 'link-btn', type: 'button', text: '삭제', 'aria-label': `삭제: ${label}`, onclick: () => remove(t.id) }))));
}

function renderList() {
  const box = $('#list');
  box.replaceChildren();
  const q = query.trim().toLowerCase();
  const monthly = monthTx(view.y, view.m);
  const items = monthly
    .filter((t) => (filter === 'all' || t.type === filter) && (!q || `${t.memo} ${t.category}`.toLowerCase().includes(q)))
    .sort((a, b) => b.date.localeCompare(a.date) || b.seq - a.seq);
  $('#count').textContent = items.length ? `${items.length}건` : '';

  if (!items.length) {
    if (!meta.total) {
      box.append(el('div', { class: 'empty' },
        el('div', { text: '아직 기록이 없어요. 왼쪽에서 첫 내역을 추가해 보세요.' }),
        el('div', {}, el('button', { class: 'link-btn', type: 'button', text: '샘플 데이터로 먼저 체험하기', onclick: addSamples }))));
    } else {
      box.append(el('div', { class: 'empty', text: monthly.length ? '조건에 맞는 내역이 없어요.' : '이 달에는 내역이 없어요.' }));
    }
    return;
  }

  const groups = new Map();
  for (const t of items) {
    if (!groups.has(t.date)) groups.set(t.date, []);
    groups.get(t.date).push(t);
  }
  for (const [date, rows] of groups) {
    const [yy, mm, dd] = date.split('-').map(Number);
    const tot = totals(rows);
    box.append(el('div', { class: 'day' },
      el('div', { class: 'day-head' },
        el('span', { text: `${mm}월 ${dd}일 (${DOW[new Date(yy, mm - 1, dd).getDay()]})` }),
        el('span', { class: 'day-sum' },
          tot.inc ? el('span', { class: 'income', text: '+' + num(tot.inc) }) : null,
          tot.exp ? el('span', { class: 'expense', text: '-' + num(tot.exp) }) : null)),
      rows.map(rowEl)));
  }
}

/* ---------- 폼 ---------- */
const form = $('#form');
const dateEl = $('#date');
const catsEl = $('#cats');
const amountEl = $('#amount');
const errEl = $('#err');
const currentType = () => form.elements.type.value;
const currentCat = () => form.elements.cat ? form.elements.cat.value : '';

function fillCats(type, selected, keepUnknown = false) {
  const names = CATS[type].map((c) => c[0]);
  if (keepUnknown && selected && !names.includes(selected)) names.push(selected);   // 수정할 때만: 불러온 내역의 낯선 분류 유지
  catsEl.className = 'cats' + (names.length === 4 ? ' c4' : '');
  catsEl.replaceChildren(...names.map((n) =>
    el('label', { class: 'cat-opt', style: `--c:${colorOf(type, n)}` },
      el('input', { type: 'radio', name: 'cat', value: n }),
      el('span', { class: 'box' }, icon(type, n), el('span', { class: 'nm', text: n })))));
  form.elements.cat.value = selected && names.includes(selected) ? selected : names[0];
}

form.elements.type.forEach((r) => r.addEventListener('change', () => fillCats(currentType(), currentCat())));

amountEl.addEventListener('input', () => {
  const digits = amountEl.value.replace(/\D/g, '').slice(0, 11);
  amountEl.value = digits ? num(Number(digits)) : '';
  errEl.textContent = '';
});

/* 서버에 쓰는 일은 한 번에 하나씩만 (연타로 중복 저장되는 것 방지). 실패하면 안내 문구를 띄움 */
async function run(task, failMsg) {
  if (busy) return false;
  busy = true;
  $('#submitBtn').disabled = true;
  try { await task(); return true; }
  catch (err) { console.error(err); toast(denied(err) ? DENIED : failMsg); return false; }
  finally { busy = false; $('#submitBtn').disabled = false; }
}
const NET_FAIL = '인터넷 연결을 확인하고 다시 시도해 주세요.';

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const amount = Number(amountEl.value.replace(/\D/g, ''));
  if (!amount) { errEl.textContent = '금액을 입력해 주세요.'; amountEl.focus(); return; }
  errEl.textContent = '';

  const old = editingId && tx.find((t) => t.id === editingId);
  const row = toRow({ date: dateEl.value, type: currentType(), category: currentCat(), amount });
  let gone = false;
  const ok = await run(async () => {
    if (old) {
      const { data, error } = await db().update(row).eq('id', old.id).select('id');
      if (error) throw error;
      gone = !data.length;   // 다른 기기에서 이미 지운 내역
    } else {
      const { error } = await db().insert(row);
      if (error) throw error;
    }
  }, `저장하지 못했어요. ${NET_FAIL}`);
  if (!ok) return;
  if (gone) toast('이미 삭제된 내역이라 수정하지 못했어요.');

  const [y, m] = row.date.split('-').map(Number);
  view = { y, m: m - 1 };
  stopEditing();
  amountEl.value = '';
  await refresh();
  if (!old) amountEl.focus();
});

function startEdit(id) {
  const t = tx.find((x) => x.id === id);
  if (!t) return;
  editingId = id;
  form.elements.type.value = t.type;
  fillCats(t.type, t.category, true);
  dateEl.value = t.date;
  amountEl.value = num(t.amount);
  errEl.textContent = '';
  $('#formTitle').textContent = '내역 수정';
  $('#submitBtn').textContent = '수정 완료';
  $('#cancelEdit').hidden = false;
  $('#formCard').classList.add('editing');
  renderList();
  $('#formCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  amountEl.focus();
}

function stopEditing() {
  editingId = null;
  $('#formTitle').textContent = '내역 추가';
  $('#submitBtn').textContent = '추가';
  $('#cancelEdit').hidden = true;
  $('#formCard').classList.remove('editing');
  fillCats(currentType(), currentCat());   // 수정 중에만 있던 낯선 분류 칸을 정리
}

$('#cancelEdit').addEventListener('click', () => {
  stopEditing();
  amountEl.value = '';
  errEl.textContent = '';
  renderList();
});

async function remove(id) {
  const item = tx.find((t) => t.id === id);
  if (!item) return;
  const ok = await run(async () => {
    const { error } = await db().delete().eq('id', id);
    if (error) throw error;
  }, `삭제하지 못했어요. ${NET_FAIL}`);
  if (!ok) return;
  if (editingId === id) { stopEditing(); amountEl.value = ''; }
  toast('내역을 삭제했어요.', '실행 취소', () => undo(item));
  await refresh();
}

async function undo(item) {
  const ok = await run(async () => {
    const { error } = await db().insert({ id: item.id, seq: item.seq, ...toRow(item), memo: item.memo, sample: item.sample });   // seq도 그대로 넣어서 원래 순서 복원
    if (error) throw error;
  }, `되돌리지 못했어요. ${NET_FAIL}`);
  if (ok) await refresh();
}

/* ---------- 목록 필터·월 이동 ---------- */
document.querySelectorAll('input[name=filter]').forEach((r) =>
  r.addEventListener('change', () => { filter = r.value; renderList(); }));
$('#search').addEventListener('input', (e) => { query = e.target.value; renderList(); });

/* ---------- 서버에서 불러오기 ---------- */
function showNotice(msg, retry) {
  $('#noticeMsg').textContent = msg;
  $('#noticeRetry').hidden = !retry;
  $('#noticeRetry').onclick = retry;
  $('#notice').hidden = false;
}
const hideNotice = () => { $('#notice').hidden = true; };

// 보고 있는 달과 지난달(지난달 대비 계산용)을 받아옴. withMeta: 전체·샘플 건수도 같이 갱신
async function refresh({ withMeta = true } = {}) {
  const my = ++reqId;
  const first = iso(new Date(view.y, view.m - 1, 1));
  const end = iso(new Date(view.y, view.m + 1, 1));
  try {
    const [rows, counts] = await Promise.all([
      fetchAll(() => db().select(COLS).gte('date', first).lt('date', end).order('date', { ascending: false }).order('seq', { ascending: false })),
      withMeta ? Promise.all([count(), count((q) => q.eq('sample', true))]) : null,
    ]);
    if (my !== reqId) return;   // 그 사이 달을 옮기거나 새로 불러옴 → 오래된 응답은 버림
    tx = rows;
    if (counts) meta = { total: counts[0], samples: counts[1] };
    failed = false;
    hideNotice();
  } catch (err) {
    if (my !== reqId) return;
    console.error(err);
    failed = true;
    showNotice(denied(err) ? DENIED : '서버에서 내역을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.', () => { loading = true; render(); refresh(); });
  }
  loading = false;
  render();
}

function goTo(y, m) {
  view = { y, m };
  loading = true;
  render();
  refresh({ withMeta: false });
}
function shiftMonth(delta) {
  const d = new Date(view.y, view.m + delta, 1);
  goTo(d.getFullYear(), d.getMonth());
}
$('#prev').addEventListener('click', () => shiftMonth(-1));
$('#next').addEventListener('click', () => shiftMonth(1));
$('#thisMonth').addEventListener('click', () => goTo(now.getFullYear(), now.getMonth()));

/* ---------- 토스트 ---------- */
let toastTimer;
function hideToast() { $('#toast').hidden = true; }
function toast(msg, actionLabel, action) {
  const t = $('#toast');
  t.replaceChildren(el('span', { text: msg }));
  if (action) t.append(el('button', { type: 'button', text: actionLabel, onclick: () => { action(); hideToast(); } }));
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 5000);
}

/* ---------- 데이터 관리 ---------- */
function download(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = el('a', { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const csvCell = (v) => { const s = String(v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

// 내보내기는 화면에 올라와 있는 달만이 아니라 전체 내역이 대상 (오래된 순)
async function fetchEverything() {
  try { return await fetchAll(() => db().select(COLS).order('date').order('seq')); }
  catch (err) { console.error(err); toast(`내역을 불러오지 못했어요. ${NET_FAIL}`); return null; }
}

$('#exportCsv').addEventListener('click', async () => {
  const rows = await fetchEverything();
  if (!rows) return;
  if (!rows.length) { toast('내보낼 내역이 없어요.'); return; }
  const withMemo = rows.some((t) => t.memo);   // 예전 메모가 남아 있을 때만 메모 열을 넣음
  const lines = [['날짜', '구분', '분류', '금액', ...(withMemo ? ['메모'] : [])].join(',')]
    .concat(rows.map((t) => [t.date, t.type === 'income' ? '수입' : '지출', t.category, t.amount, ...(withMemo ? [t.memo] : [])].map(csvCell).join(',')));
  download(`가계부_${iso(new Date())}.csv`, '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
});

$('#exportJson').addEventListener('click', async () => {
  const rows = await fetchEverything();
  if (!rows) return;
  if (!rows.length) { toast('백업할 내역이 없어요.'); return; }
  const out = rows.map(({ id, date, type, category, amount, memo }) => ({ id, date, type, category, amount, memo }));
  download(`gagyebu-backup-${iso(new Date())}.json`, JSON.stringify(out, null, 2), 'application/json');
});

$('#importJson').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let list;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw new Error('not array');
    list = data.filter(isValid).map(clean).sort(byTs);
  } catch {
    toast('불러올 수 없는 파일이에요. 이 가계부에서 저장한 JSON 백업 파일인지 확인해 주세요.');
    return;
  }
  let added = 0;
  const ok = await run(async () => { added = await importRows(list); }, `불러오지 못했어요. ${NET_FAIL}`);
  if (!ok) return;
  await refresh();
  toast(`${added}건을 불러왔어요.`);
});

$('#wipe').addEventListener('click', async () => {
  let total;
  try { total = await count(); } catch (err) { console.error(err); toast(`서버에 연결하지 못했어요. ${NET_FAIL}`); return; }
  if (!total) { toast('삭제할 내역이 없어요.'); return; }
  if (!confirm(`저장된 내역 ${total}건을 모두 삭제할까요? 되돌릴 수 없어요.`)) return;
  const ok = await run(async () => {
    const { error } = await db().delete().not('id', 'is', null);
    if (error) throw error;
  }, `삭제하지 못했어요. ${NET_FAIL}`);
  if (!ok) return;
  stopEditing();
  amountEl.value = '';
  await refresh();
});

/* ---------- 예전 기록(이 브라우저에 저장돼 있던 것) 옮기기 ---------- */
function checkLegacy() {
  const n = legacyRows().length;
  $('#legacyN').textContent = n;
  $('#legacy').hidden = !n || legacyLater;
}
$('#legacyLater').addEventListener('click', () => { legacyLater = true; checkLegacy(); });
$('#legacyMove').addEventListener('click', async () => {
  let moved = 0;
  const ok = await run(async () => {
    moved = await importRows(legacyRows());
    try { localStorage.removeItem(LEGACY_KEY); } catch { /* 서버에는 이미 올라갔으니 무시 */ }   // 서버에 올라간 걸 확인한 뒤에만 지움
  }, `옮기지 못했어요. 예전 기록은 그대로 남아 있으니 ${NET_FAIL}`);
  if (!ok) return;
  checkLegacy();
  await refresh();
  toast(`${moved}건을 서버로 옮겼어요.`);
});

/* ---------- 샘플 ---------- */
async function addSamples() {
  const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
  const pd = new Date(y, m - 1, 1);
  const prevLast = new Date(y, m, 0).getDate();
  const cur = [
    [1, 'income', '급여', 2800000], [1, 'expense', '주거·통신', 550000],
    [2, 'expense', '식비', 8500], [3, 'expense', '교통', 1450],
    [4, 'expense', '식비', 32000], [5, 'expense', '쇼핑', 45900],
    [6, 'expense', '문화·여가', 14000], [8, 'expense', '식비', 21400],
    [9, 'expense', '의료·건강', 7500], [10, 'income', '부수입', 120000],
    [11, 'income', '용돈', 50000], [12, 'expense', '교통', 55000],
    [14, 'expense', '식비', 6200], [15, 'expense', '주거·통신', 48000],
    [16, 'expense', '경조사', 50000], [17, 'expense', '교육', 29000],
  ].map((r) => [y, m, Math.min(r[0], today), ...r.slice(1)]);
  const prev = [
    [1, 'income', '급여', 2800000], [1, 'expense', '주거·통신', 550000],
    [5, 'expense', '식비', 64000], [9, 'expense', '쇼핑', 120000],
    [13, 'expense', '식비', 43000], [18, 'expense', '교통', 52000],
    [22, 'expense', '경조사', 100000], [27, 'expense', '문화·여가', 33000],
  ].map((r) => [pd.getFullYear(), pd.getMonth(), Math.min(r[0], prevLast), ...r.slice(1)]);

  // 샘플은 sample=true 로 표시해 두어서, 나중에 실제 기록과 섞이지 않게 따로 지울 수 있음
  const rows = [...prev, ...cur].map(([yy, mm, dd, type, category, amount]) =>
    ({ ...toRow({ date: `${yy}-${pad(mm + 1)}-${pad(dd)}`, type, category, amount }), sample: true }));
  const ok = await run(async () => {
    const { error } = await db().insert(rows);
    if (error) throw error;
  }, `샘플을 넣지 못했어요. ${NET_FAIL}`);
  if (!ok) return;
  await refresh();
  toast('샘플 데이터를 넣었어요.', '지우기', removeSamples);
}

async function removeSamples() {
  const ok = await run(async () => {
    const { error } = await db().delete().eq('sample', true);
    if (error) throw error;
  }, `지우지 못했어요. ${NET_FAIL}`);
  if (!ok) return;
  await refresh();
  toast('샘플 데이터를 지웠어요.');
}
$('#wipeSample').addEventListener('click', removeSamples);

/* ---------- 시작 ---------- */
dateEl.value = iso(now);
fillCats('expense');
if (!sb) {
  $('#main').hidden = true;
  showNotice('서버와 연결하는 데 필요한 파일을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.', () => location.reload());
} else {
  loading = true;
  render();
  checkLegacy();
  refresh();
}
})();
</script>
